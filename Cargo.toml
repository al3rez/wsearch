[package]
name = "wsearch"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Whole-disk file search for Windows: NTFS MFT crawl, USN live updates, fuzzy names, trigram content grep."
repository = "https://github.com/noahdunnagan/fsearch"
readme = "README.md"

[dependencies]
memchr = "2.7"
memmap2 = "0.9"
rayon = "1.10"
regex = "1.11"
regex-syntax = "0.8"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_WindowsProgramming",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
